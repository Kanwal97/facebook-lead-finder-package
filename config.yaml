# ── Facebook ─────────────────────────────────────────────────────────────
# Automating a personal Facebook account is against Facebook's terms. The
# pacing below keeps the tool slow and human-paced, which lowers the chance
# of a checkpoint but does not remove it. Keep the limits modest.
facebook:
  db_path: leads.db                      # relative to this file
  mode: assist                           # assist: you scroll, the tool reads. auto: it scrolls, slowly.
  pacing:
    warmup_until: 2026-11-14             # counts halved until this date, so a fresh profile starts gently
    groups_per_run: 6
    runs_per_day: 3
    min_hours_between_runs: 3
    page_loads_per_day: 25
    active_hours: [9, 22]
  read:
    max_post_age_days: 14
    min_text_chars: 40
  lead:
    min_score: 50
  discovery:
    searches_per_day: 4
    min_members: 2000
    min_group_score: 60
    # Facebook group search is literal, so describe the audience, not the problem.
    queries:
      - shopify store owners
      - ecommerce entrepreneurs
      - woocommerce store owners
      - amazon fba sellers
      - etsy sellers
      - saas founders
      - startup founders
      - small business owners
      - digital marketing agency owners
      - real estate investors
      - restaurant owners
      - online coaches and course creators
      - hire web developers
      - freelance web development jobs
    junk_keywords: []                    # merged with filters.junk_keywords above
