# ── AI: local open-source model via an OpenAI-compatible server ──────────
# Default is Ollama (https://ollama.com). Also works with LM Studio
# (http://localhost:1234/v1), llama.cpp server (http://localhost:8080/v1) or vLLM.
# Environment variables LLM_BASE_URL, LLM_MODEL, LLM_API_KEY override these.
ai:
  # Ollama runs on another machine: use its LAN address, e.g. http://192.168.1.50:11434/v1
  # On that machine Ollama must listen on all interfaces: OLLAMA_HOST=0.0.0.0 ollama serve
  base_url: http://localhost:11434/v1
  model: qwen3:4b              # ollama pull qwen3:4b   (~2.6 GB, fits in 8 GB RAM)
  api_key: null                # only if your server needs one (Ollama ignores it)
  max_tokens: 800
  temperature: 0.2
  timeout: 300                 # seconds; CPU inference can take a minute per post
  json_mode: true              # sends response_format=json_object; set false if your server rejects it
  extra_body:
    reasoning_effort: none     # Ollama: turns off Qwen3/DeepSeek "thinking", which is slow on CPU.
                               # Remove this line for LM Studio / llama.cpp if they reject it.

